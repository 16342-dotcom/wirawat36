<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | พอร์ตโฟลิโอสถาปัตยกรรมศาสตร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#FDEEF2; --blush-deep:#FBD9E4; --rose:#F2A6C4; --rose-dark:#D9668F;
    --mauve:#6E2A46; --ink:#2B1B22; --gold:#D9B382;
    --glass-bg:rgba(255,255,255,.5); --glass-border:rgba(255,255,255,.75);
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  
  body {
      background-color: var(--blush);
      min-height: 100vh;
      margin: 0;
      position: relative;
  }
  body::after {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background-image: 
          linear-gradient(rgba(110, 42, 70, 0.1) 1px, transparent 1px), 
          linear-gradient(90deg, rgba(110, 42, 70, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
  }

  /* --- Navbar --- */
  .navbar{position:fixed;top:0;left:0;width:100%;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,5vw,60px);background:rgba(255,255,255,.45);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border);}
  .logo{font-family:'Prompt',sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:1px;color:var(--mauve);display:flex;align-items:center;gap:8px;}
  .logo span{width:10px;height:10px;border-radius:50%;background:var(--rose-dark);display:inline-block;box-shadow:0 0 0 4px rgba(217,102,143,.25);}
  .nav-links{display:flex;gap:clamp(10px,2vw,32px);list-style:none;}
  .nav-links a{text-decoration:none;color:var(--mauve);font-family:'Prompt',sans-serif;font-size:.85rem;letter-spacing:1.5px;font-weight:500;padding:8px 4px;position:relative;transition:color .3s;}
  .nav-links a.active{color:var(--rose-dark);font-weight:600;border-bottom:2px solid var(--rose-dark);}
  .nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;}
  .nav-toggle span{width:24px;height:2px;background:var(--mauve);}

  /* --- เนื้อหา --- */
  .page-wrap{max-width:900px;margin:0 auto;padding:140px 24px 60px;}
  .page-head{text-align:center;margin-bottom:52px;}
  .page-head h1{font-size:clamp(1.8rem,4vw,2.6rem);color:var(--mauve);font-family:'Prompt',sans-serif;}
  
  /* Grid สำหรับ 4 กล่อง */
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:24px;}
  
  /* สไตล์กล่องแต่ละกล่องที่คลิกได้ */
  .glass-card{
      background:var(--glass-bg);border:1px solid var(--glass-border);
      backdrop-filter:blur(18px);border-radius:var(--radius);
      padding:24px;text-align:center;text-decoration:none;
      transition:transform .3s, background .3s;
  }
  .glass-card:hover{transform:translateY(-5px);background:rgba(255,255,255,.7);}
  .glass-card h3{color:var(--mauve);margin-bottom:8px;font-size:1.1rem;}
  .glass-card p{font-size:0.95rem;color:var(--ink);word-break:break-all;}
  
  .nav-buttons{display:flex;justify-content:space-between;margin-top:44px;gap:16px;}
  .btn{display:inline-flex;align-items:center;padding:14px 32px;border-radius:100px;text-decoration:none;font-family:'Prompt',sans-serif;font-weight:500;border:none;cursor:pointer;transition:transform .3s;}
  .btn-outline{border:1.5px solid var(--mauve);color:var(--mauve);}

  @media(max-width:640px){
    .nav-links{position:absolute;top:100%;left:0;width:100%;flex-direction:column;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 24px;}
    .nav-links.open{max-height:320px;padding:16px 24px 24px;}
    .nav-toggle{display:flex;}
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo"><span></span>PORTFOLIO — ARCH.</div>
  <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">HOME</a></li>
    <li><a href="profile.html">PROFILE</a></li>
    <li><a href="education.html">EDUCATION</a></li>
    <li><a href="award.html">AWARD</a></li>
    <li><a href="contact.html" class="active">CONTACT</a></li>
  </ul>
</nav>

<div class="page-wrap">
  <div class="page-head">
    <h1>ช่องทางการติดต่อ</h1>
  </div>

  <div class="contact-grid">
    <!-- กล่องที่ 1: โทรศัพท์ -->
    <a href="tel:0624374100" class="glass-card">
      <h3>โทรศัพท์</h3>
      <p>062-437-4100</p>
    </a>
    <!-- กล่องที่ 2: อีเมล -->
    <a href="mailto:wirawatburapakon@gmail.com" class="glass-card">
      <h3>อีเมล</h3>
      <p>wirawatburapakon@gmail.com</p>
    </a>
    <!-- กล่องที่ 3: Facebook -->
    <a href="https://www.facebook.com/share/18qBbKvVrq/?mibextid=wwXIfr" target="_blank" class="glass-card">
      <h3>Facebook</h3>
      <p>อนาคิน ’น</p>
    </a>
    <!-- กล่องที่ 4: Instagram -->
    <a href="https://www.instagram.com/_parkin_01?igsh=NHVicXhndnk4b21i&utm_source=qr" target="_blank" class="glass-card">
      <h3>Instagram</h3>
      <p>@parkin_01</p>
    </a>
  </div>

  <div class="nav-buttons">
    <a href="award.html" class="btn btn-outline">← ย้อนกลับ</a>
  </div>
</div>

<script>
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
</script>
</body>
</html>
