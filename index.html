<!DOCTYPE html>
<html lang="th">

<!-- ===================== -->
<!-- HEAD -->
<!-- ===================== -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Architecture Portfolio</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =======================================
   1. ตั้งค่าพื้นฐาน
======================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
    scroll-behavior:smooth;
}

body{
    background-image:
    linear-gradient(
    rgba(255,255,255,.75),
    rgba(255,255,255,.75)
    ),
    url("background.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    color:#555;
}

/* =======================================
   2. Navbar
======================================= */

nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    padding:18px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);
    z-index:999;
}

nav a{
    text-decoration:none;
    color:#555;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:#ff6fae;
}

/* =======================================
   3. Hero
======================================= */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;

    background:linear-gradient(
    135deg,
    rgba(190,235,255,.8),
    rgba(255,210,235,.8)
    );
}

.hero img{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid white;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.hero h1{
    font-size:50px;
    margin-top:20px;
    color:#ff72b8;
}

.hero p{
    font-size:22px;
    margin-top:10px;
}

.hero button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#75caff;
    color:white;
    cursor:pointer;
}

/* =======================================
   4. Section
======================================= */

section{
    padding:100px 12%;
}

.title{
    font-size:40px;
    text-align:center;
    margin-bottom:50px;
    color:#5ba7ff;
}

/* =======================================
   5. About
======================================= */

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    align-items:center;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
}

/* =======================================
   6. Skills
======================================= */

.skills{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.skill{
    background:white;
    padding:25px;
    border-radius:20px;
}

.bar{
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
    background:linear-gradient(90deg,#79cfff,#ff8dc2);
}

/* =======================================
   7. Portfolio
======================================= */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.work{
    background:white;
    border-radius:20px;
    overflow:hidden;
}

.work img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* =======================================
   8. Contact
======================================= */

.contact{
    text-align:center;
}

.contact p{
    margin:15px;
}

/* =======================================
   9. Footer
======================================= */

footer{
    text-align:center;
    padding:30px;
    background:#dff3ff;
}

</style>

</head>

<body>

<!-- =======================================
     Navbar
======================================= -->

<nav>
    ...
</nav>

<!-- =======================================
     Hero
======================================= -->

<div class="hero">

    <img src="profile.jpg" alt="รูปโปรไฟล์">

    <h1>นาย วิรวัฒน์ บูรพกรณ์</h1>

    <p>นักเรียนชั้นมัธยมศึกษาปีที่ 6</p>

    <p>Dream to become an Architect 🏛️</p>

</div>

<!-- =======================================
     About
======================================= -->

<section id="about">

...

</section>

<!-- =======================================
     Education
======================================= -->

<section id="education">

...

</section>

<!-- =======================================
     Skills
======================================= -->

<section id="skills">

...

</section>

<!-- =======================================
     Portfolio
======================================= -->

<section id="portfolio">

...

</section>

<!-- =======================================
     Contact
======================================= -->

<section id="contact">

...

</section>

<!-- =======================================
     Footer
======================================= -->

<footer>

Made with ❤️ for Architecture Portfolio

</footer>

</body>
</html>
